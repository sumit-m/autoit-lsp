name: Release

# Build cross-platform release binaries on tag push, then attach them to a
# GitHub Release. The Zed extension (sumit-m/zed-autoit) consumes these
# artifacts via `zed::latest_github_release` + `zed::download_file`.
#
# Asset naming matches the convention the extension's `src/lib.rs` looks
# for: `autoit-lsp-<target-triple>.<ext>`. Keep that contract stable —
# downstream changes are coordinated across this repo and zed-autoit.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write  # needed to create the release and upload assets

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: autoit-lsp.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: autoit-lsp
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: autoit-lsp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Package (Windows — zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "autoit-lsp-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $stage/
          Copy-Item LICENSE $stage/
          Copy-Item README.md $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Write-Host "Packaged $stage.zip"

      - name: Package (Unix — tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          stage="autoit-lsp-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          cp LICENSE "$stage/"
          cp README.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          echo "Packaged $stage.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoit-lsp-${{ matrix.target }}
          path: |
            autoit-lsp-${{ matrix.target }}.zip
            autoit-lsp-${{ matrix.target }}.tar.gz
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag and release name come from the pushed tag.
          name: ${{ github.ref_name }}
          # `generate_release_notes: true` makes GitHub auto-populate
          # changelog from commits since the last tag. The annotated-tag
          # message remains the description.
          generate_release_notes: true
          files: |
            dist/autoit-lsp-x86_64-pc-windows-msvc.zip
            dist/autoit-lsp-x86_64-unknown-linux-gnu.tar.gz
            dist/autoit-lsp-aarch64-apple-darwin.tar.gz
          fail_on_unmatched_files: true
