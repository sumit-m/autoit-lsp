[package]
name = "autoit-lsp"
version = "0.3.0"
edition = "2024"
description = "Language Server for AutoIt v3 — Au3Check diagnostics wrapper"
license = "MIT"
repository = "https://github.com/sumit-m/autoit-lsp"
readme = "README.md"
keywords = ["lsp", "autoit", "language-server"]
categories = ["development-tools"]

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Sprint 1 — tree-sitter parse-tree-per-document infrastructure. Used by
# document symbols (Day 2), hover (Day 3), and every v0.3+ Option-3 feature
# (go-to-def, find-refs, completion).
#
# Pinned to a specific tree-sitter-autoit commit. The GitHub repo doesn't
# exist publicly until Phase 8 Bundle 1; until then, local builds need
# either a temporary flip to `path = "../tree-sitter-autoit"` or a
# `[patch."https://github.com/sumit-m/tree-sitter-autoit"]` block in a
# gitignored `.cargo/config.toml`. After Bundle 1 (`tree-sitter-autoit`
# pushed to GitHub), this resolves naturally.
tree-sitter = "0.25"
tree-sitter-autoit = { git = "https://github.com/sumit-m/tree-sitter-autoit", rev = "f421a68daaffaa25d89b34c66d7b97bf49b9d845" }

# Windows registry lookup for Au3Check.exe discovery (mirrors the
# tasks.json approach in the zed-autoit extension — same HKLM lookup
# chain with hardcoded fallback). Use the MSVC toolchain on Windows;
# the GNU toolchain has dlltool issues that don't link tokio cleanly.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
# Optimize for binary size since this ships as a downloaded artifact.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
